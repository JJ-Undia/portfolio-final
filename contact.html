<h1>Contact me</h1>
<p>You can email me directly at <a href="mailto:j.undiandeye9994@miva.edu.ng">j.undiandeye9994@miva.edu.ng</a> or use the form below.</p>
<p>Phone: <a href="tel:+2348127410458">08127410458</a></p>
<section class="panel">
  <form id="contactForm" novalidate>
    <label for="name">Name</label>
    <input id="name" type="text">
    <p class="err" id="nameErr"></p>
    <label for="email">Email address</label>
    <input id="email" type="text">
    <p class="err" id="emailErr"></p>
    <label for="phone">Phone number</label>
    <input id="phone" type="text" inputmode="numeric">
    <p class="err" id="phoneErr"></p>
    <label for="message">Message</label>
    <textarea id="message" rows="5"></textarea>
    <p class="err" id="messageErr"></p>
    <button class="btn" type="submit">Send message</button>
    <p id="formOk" class="ok" role="status"></p>
  </form>
</section>
