<h1>Academic planner</h1>
<section class="panel">
  <form id="taskForm">
    <label for="taskInput">New task</label>
    <div class="row">
      <input id="taskInput" type="text" placeholder="e.g. Finish COS 106 project" autocomplete="off">
      <button class="btn" type="submit">Add task</button>
    </div>
    <p id="taskMsg" class="msg" role="alert"></p>
  </form>
  <p id="count" aria-live="polite"></p>
  <ul id="taskList" class="tasks"></ul>
</section>
